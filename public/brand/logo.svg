<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cohartHeartGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer "C" contour -->
  <path d="M 132 46 A 65 65 0 1 0 132 154" 
        stroke="#FFFFFF" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- Inner Vibrant Electric Cyan-to-Azure Heart -->
  <path d="M 82 120 
           L 100 98 
           C 107 90, 118 90, 125 97 
           C 132 104, 132 115, 124 122 
           L 100 146 
           L 76 122 
           C 68 115, 68 104, 75 97 
           C 82 90, 93 90, 100 98" 
        stroke="url(#cohartHeartGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#cyanGlow)" />
</svg>
